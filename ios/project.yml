# The Xcode project is made from this file: `brew install xcodegen`, then `xcodegen` in this folder.
name: JustWrite
options:
  bundleIdPrefix: com.makinoatorie
  deploymentTarget:
    iOS: "17.0"
targets:
  JustWrite:
    type: application
    platform: iOS
    sources: [Sources]
    preBuildScripts:
      - name: Rust library
        script: sh "$SRCROOT/build-rust.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: Security.framework
      - sdk: libiconv.tbd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JustWrite
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # An iPad app that can share the screen must turn all four ways.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/justwrite.h
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build-rust
        OTHER_LDFLAGS: -ljustwrite
        # The Rust build reads and writes outside the project folder.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
