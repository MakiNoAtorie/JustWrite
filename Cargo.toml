[package]
name = "justwrite"
version = "0.1.0"
edition = "2024"
description = "A light native desktop app for writing fiction manuscripts"
license = "MIT"

[lib]
name = "justwrite"
path = "src/lib.rs"

[dependencies]
ropey = "1.6"
tempfile = "3.27"
im = "15.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
zip = { version = "8", default-features = false, features = ["deflate"] }
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
similar = "3"
quick-xml = "0.42"
regex-lite = "0.1"
# Cloud saving. TLS trusts the operating system's certificate store, so a private CA works.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
sha2 = "0.11"
getrandom = "0.3"

# The desktop interface. The iOS build is the library without it.
[target.'cfg(not(target_os = "ios"))'.dependencies]
winit = "0.30"
softbuffer = "0.4"
cosmic-text = "0.19"
arboard = { version = "3.6", default-features = false }
notify = "8.2"
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
zspell = "0.5.5"
keyring = "4"

# `keyring` has no default store on iOS; the Keychain is reached through the protected data store.
[target.'cfg(target_os = "ios")'.dependencies]
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["protected"] }

[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Quick local builds for run.bat; `--release` stays fat-LTO/small for shipping.
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16
opt-level = 2

[[bin]]
name = "justwrite"
path = "src/main.rs"

[[bin]]
name = "performance-check"
path = "src/bin/performance-check.rs"

[[bin]]
name = "large-file-check"
path = "src/bin/large-file-check.rs"

# The Hunspell dictionaries expand large affix tables; keep that fast even in debug builds.
[profile.dev.package.zspell]
opt-level = 3
