[package]
name = "justwrite"
version = "0.1.0"
edition = "2024"
description = "A light native desktop app for writing fiction manuscripts"
license = "MIT"

[lib]
name = "justwrite"
path = "src/lib.rs"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
cosmic-text = "0.19"
ropey = "1.6"
arboard = { version = "3.6", default-features = false }
notify = "8.2"
tempfile = "3.27"
im = "15.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
zip = { version = "8", default-features = false, features = ["deflate"] }
blake3 = { version = "1", default-features = false, features = ["std", "pure"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
similar = "3"
quick-xml = "0.42"
regex-lite = "0.1"
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
zspell = "0.5.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[[bin]]
name = "justwrite"
path = "src/main.rs"

[[bin]]
name = "performance-check"
path = "src/bin/performance-check.rs"

# The Hunspell dictionaries expand large affix tables; keep that fast even in debug builds.
[profile.dev.package.zspell]
opt-level = 3
